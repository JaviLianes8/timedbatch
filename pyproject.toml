[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timedbatch"
version = "1.0.0"
description = "Batch items by a max count and a max age, for iterables, threads and asyncio, without losing items"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = [
    "batch", "batching", "chunk", "iterator", "time-window", "streaming", "flush",
    "buffer", "asyncio", "back-pressure",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-timeout", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/timedbatch"
Issues = "https://github.com/JaviLianes8/timedbatch/issues"
Changelog = "https://github.com/JaviLianes8/timedbatch/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.sdist]
# Third-party files are fetched locally for the oracle tests and never shipped; only their
# manifest is.
exclude = [
    "IMPROVEMENTS-round*.md", "CERT-1.0-*.md", ".github", "tests/upstream/*",
    "!tests/upstream/MANIFEST.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/timedbatch"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
timeout = 300
